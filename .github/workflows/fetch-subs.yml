name: fetch-subs

on:
  push:
    branches:
      - claude/live-subtitles-english-film-4kuuim
    paths:
      - '.github/workflows/fetch-subs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch English source subtitles for Spider-Man Brand New Day (2026)
        run: |
          set -x
          mkdir -p subs
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for url in \
            "https://www.subtitlecat.com/subs/1614/Spider-Man.Brand.New.Day.2026.1080p.CAM.H264-OnlyFlix-en.srt" \
            "https://www.subtitlecat.com/subs/1612/Spider-Man.Brand.New.Day.2026.1080p.CAM.H264-OnlyFlix-en.srt"
          do
            curl -sL --max-time 60 -A "$UA" "$url" -o subs/spiderman.en.srt
            if grep -q -- '-->' subs/spiderman.en.srt; then
              echo "english source: $url" >> subs/spiderman.source.txt
              break
            fi
          done
          : > subs/spiderman-debug.txt
          found=""

          # --- 1) SubDL: look for a native Russian upload ---
          if curl -sL --max-time 60 -A "$UA" "https://subdl.com/subtitle/sd12717112/spider-man-brand-new-day/russian" -o /tmp/subdl.html; then
            echo "== subdl russian page fetched, bytes: $(wc -c < /tmp/subdl.html)" >> subs/spiderman-debug.txt
            grep -oE '"(https://dl\.subdl\.com/subtitle/[^"]+)"' /tmp/subdl.html | head -5 >> subs/spiderman-debug.txt || true
            dl=$(grep -oE 'https://dl\.subdl\.com/subtitle/[^"]+' /tmp/subdl.html | head -1)
            if [ -n "$dl" ]; then
              curl -sL --max-time 60 -A "$UA" "$dl" -o /tmp/subdl.zip
              if unzip -o /tmp/subdl.zip -d /tmp/subdl_out >> subs/spiderman-debug.txt 2>&1; then
                srt=$(find /tmp/subdl_out -iname '*.srt' | head -1)
                if [ -n "$srt" ] && grep -q -- '-->' "$srt"; then
                  cp "$srt" subs/spiderman.ru.srt
                  echo "source: subdl (native Russian upload): $dl" > subs/spiderman.source.txt
                  found="yes"
                fi
              fi
            fi
          else
            echo "subdl fetch failed" >> subs/spiderman-debug.txt
          fi

          # --- 2) SubSource: native Russian ---
          if [ -z "$found" ]; then
            curl -sL --max-time 60 -A "$UA" "https://subsource.net/subtitles/spider-man-brand-new-day-2026/russian" -o /tmp/subsource.html || true
            echo "== subsource bytes: $(wc -c < /tmp/subsource.html 2>/dev/null || echo 0)" >> subs/spiderman-debug.txt
            grep -oE 'href="[^"]*russian[^"]*"' /tmp/subsource.html | head -10 >> subs/spiderman-debug.txt || true
          fi

          # --- 3) subtitlecat fallback (auto-translated, proven to work) ---
          if [ -z "$found" ]; then
            for page in \
              "https://www.subtitlecat.com/subs/1612/Spider-Man.Brand.New.Day.2026.1080p.CAM.H264-OnlyFlix.html" \
              "https://www.subtitlecat.com/subs/1612/Spider-Man.Brand.New.Day.2026.html"
            do
              curl -sL --max-time 60 -A "$UA" "$page" -o /tmp/cat.html || continue
              grep -oE 'href="[^"]+\.srt"' /tmp/cat.html | sort -u >> subs/spiderman-debug.txt || true
              ru=$(grep -oE 'href="[^"]+[-._]ru\.srt"' /tmp/cat.html | head -1 | sed 's/^href="//;s/"$//')
              if [ -n "$ru" ]; then
                case "$ru" in
                  http*) url="$ru" ;;
                  /*)    url="https://www.subtitlecat.com$ru" ;;
                  *)     url="$(dirname "$page")/$ru" ;;
                esac
                curl -sL --max-time 60 -A "$UA" "$url" -o subs/spiderman.ru.srt
                if grep -q -- '-->' subs/spiderman.ru.srt; then
                  echo "source: subtitlecat (machine translated): $url" > subs/spiderman.source.txt
                  found="yes"
                  break
                fi
              fi
            done
          fi

          ls -la subs/

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add subs/
          git commit -m "Add fetched subtitle files" || echo "nothing to commit"
          git push
