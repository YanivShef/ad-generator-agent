name: fetch-subs

on:
  push:
    branches:
      - claude/live-subtitles-english-film-4kuuim
    paths:
      - '.github/workflows/fetch-subs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-native-russian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for professionally-made Russian subtitles (Spider-Man Brand New Day 2026)
        run: |
          set -x
          mkdir -p subs
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          : > subs/native-scan.log
          echo "scan at $(date -u +%FT%TZ)" >> subs/native-scan.log
          found=""

          # --- SubDL: russian page lists uploaded (non-auto) subs with dl.subdl.com zip links ---
          if curl -sL --max-time 60 -A "$UA" "https://subdl.com/subtitle/sd12717112/spider-man-brand-new-day/russian" -o /tmp/subdl.html; then
            grep -oE 'https://dl\.subdl\.com/subtitle/[^"]+' /tmp/subdl.html | sort -u | tee -a subs/native-scan.log | head -3 > /tmp/subdl_links.txt
            while read -r dl; do
              [ -z "$dl" ] && continue
              curl -sL --max-time 60 -A "$UA" "$dl" -o /tmp/cand.zip || continue
              rm -rf /tmp/cand_out; mkdir -p /tmp/cand_out
              unzip -o /tmp/cand.zip -d /tmp/cand_out >> subs/native-scan.log 2>&1 || continue
              srt=$(find /tmp/cand_out -iname '*.srt' | head -1)
              if [ -n "$srt" ] && grep -q -- '-->' "$srt" && grep -qP '[а-яА-Я]' "$srt"; then
                cp "$srt" subs/spiderman.native.ru.srt
                echo "CANDIDATE from subdl: $dl" >> subs/native-scan.log
                found="yes"; break
              fi
            done < /tmp/subdl_links.txt
          fi

          # --- Podnapisi: plain-HTML search, /subtitles/<slug>/download links ---
          if [ -z "$found" ]; then
            curl -sL --max-time 60 -A "$UA" "https://www.podnapisi.net/subtitles/search/?keywords=spider-man%20brand%20new%20day&language=ru" -o /tmp/pod.html || true
            grep -oE 'href="/subtitles/[^"]+"' /tmp/pod.html | sort -u | head -10 >> subs/native-scan.log || true
            slug=$(grep -oE 'href="/subtitles/ru-[^"]+"' /tmp/pod.html | head -1 | sed 's/^href="//;s/"$//')
            if [ -n "$slug" ]; then
              curl -sL --max-time 60 -A "$UA" "https://www.podnapisi.net${slug}/download" -o /tmp/cand.zip
              rm -rf /tmp/cand_out; mkdir -p /tmp/cand_out
              if unzip -o /tmp/cand.zip -d /tmp/cand_out >> subs/native-scan.log 2>&1; then
                srt=$(find /tmp/cand_out -iname '*.srt' | head -1)
                if [ -n "$srt" ] && grep -q -- '-->' "$srt" && grep -qP '[а-яА-Я]' "$srt"; then
                  cp "$srt" subs/spiderman.native.ru.srt
                  echo "CANDIDATE from podnapisi: $slug" >> subs/native-scan.log
                  found="yes"
                fi
              fi
            fi
          fi

          if [ -z "$found" ]; then
            echo "no native russian candidate found this scan" >> subs/native-scan.log
          fi
          ls -la subs/

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add subs/
          git commit -m "Daily scan for native Russian Spider-Man subtitles" || echo "nothing to commit"
          git push
